# The GroupName here is used to identify your company or business unit that
# created this webhook.
# For example, this may be "acme.mycompany.example".
# This name will need to be referenced in each Issuer's `webhook` stanza to
# inform cert-manager of where to send ChallengePayload resources in order to
# solve the DNS01 challenge.
# This group name should be **unique**, hence using your own company's domain
# here is recommended.
groupName: acme.example.com

certManager:
  namespace: cert-manager
  serviceAccountName: cert-manager

image:
  # Required: replace this placeholder with the registry containing your built image.
  repository: local.invalid/infra/cert-manager-webhook-vkcloud
  tag: 0.3.0
  pullPolicy: IfNotPresent

nameOverride: cert-manager-webhook-vkcloud
fullnameOverride: cert-manager-webhook-vkcloud

replicaCount: 1

service:
  type: ClusterIP
  port: 443

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #  cpu: 100m
  #  memory: 128Mi
  # requests:
  #  cpu: 100m
  #  memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

imagePullSecrets: []
credentialsSecretName: vkcloud-dns-credentials

# Application logs are JSON. debug adds HTTP attempt/status/duration logs.
logging:
  level: info  # debug, info, warn, error
runtime:
  httpTimeout: 30s
  operationTimeout: 2m
  retryMaxAttempts: 3  # GET/DELETE only, including the first attempt; 1 disables retries.
  retryInitialDelay: 1s  # Exponential backoff + jitter, Retry-After honoured up to 30s.
metrics:
  enabled: true
  port: 9402
  serviceMonitor:
    # Requires the Prometheus Operator ServiceMonitor CRD. Native VM scrapes can use the endpoint directly.
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # labels: {release: kube-prometheus-stack}
    labels: {}
