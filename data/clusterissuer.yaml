# Replace the email and DNS zone with values for a domain you control.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vkcloud-letsencrypt-staging
spec:
  acme:
    email: "REPLACE_WITH_CONTACT_EMAIL"
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: vkcloud-letsencrypt-staging-account
    solvers:
      - selector:
          dnsZones: [example.com]
        dns01:
          webhook:
            groupName: acme.example.com
            solverName: cert-manager-webhook-vkcloud
            config:
              secretRef:
                name: vkcloud-dns-credentials
              region: RegionOne
              # Optional: skip zone discovery for this zone.
              # zoneID: REPLACE_WITH_DNS_ZONE_ID
              # Optional: full DNS API v2 base URL, without /dns/.
              # dnsAPIURL: https://actual-endpoint/public-dns/v2
