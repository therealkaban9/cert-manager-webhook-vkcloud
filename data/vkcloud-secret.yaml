# Example only. Supply credentials through your secret management workflow.
apiVersion: v1
kind: Secret
metadata:
  name: vkcloud-dns-credentials
  namespace: cert-manager
type: Opaque
stringData:
  os_auth_url: "https://msk.cloud.vk.ru/infra/identity/v3/"
  os_username: "REPLACE_WITH_SERVICE_ACCOUNT_USERNAME"
  os_password: "REPLACE_WITH_SERVICE_ACCOUNT_PASSWORD"
  os_project_id: "REPLACE_WITH_DNS_PROJECT_ID"
  # Service accounts use service-users; regular user accounts can use users.
  os_domain_name: "service-users"
